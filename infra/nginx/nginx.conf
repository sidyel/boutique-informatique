# Frontal nginx : l'API, le sitemap, robots.txt et les flux produits vont au backend,
# tout le reste au serveur de rendu Angular (SSR).
# HTTPS, brotli et CSP complète seront ajoutés pour la production (phase 9).

upstream backend {
    server backend:8080;
    keepalive 16;
}

upstream frontend {
    server frontend:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;
    server_tokens off;

    # --- Compression ----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml
               application/javascript application/json application/problem+json
               application/ld+json image/svg+xml;

    # --- En-têtes de sécurité de base -----------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # --- Backend --------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
    }

    location = /sitemap.xml {
        proxy_pass http://backend;
    }

    location ~ ^/sitemap-[a-z0-9-]+\.xml$ {
        proxy_pass http://backend;
    }

    location = /robots.txt {
        proxy_pass http://backend;
    }

    location /flux/ {
        proxy_pass http://backend;
    }

    # La supervision n'est jamais exposée publiquement.
    location /actuator/ {
        return 404;
    }

    # --- Pages rendues côté serveur (SSR) et fichiers statiques -------------
    # Le serveur SSR (Express) pose lui-même Cache-Control : un an, immuable,
    # pour les fichiers JS/CSS à empreinte et les polices.
    location / {
        proxy_pass http://frontend;
    }
}
