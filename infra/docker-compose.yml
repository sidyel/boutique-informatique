# Environnement complet : PostgreSQL, Redis, backend, frontend SSR et nginx.
#
# Base commune (production). En développement, toujours y ajouter infra/docker-compose.dev.yml :
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d --build   # tout dans Docker
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d postgres redis mailpit
#                                                                    # services seuls, backend et frontend lancés à la main
#
# Ports exposés sur la machine : POSTGRES_PORT_HOTE (5432), REDIS_PORT_HOTE (6379) et REDIS_CACHE_PORT_HOTE (6380),
# à définir dans le shell si ces ports sont déjà pris (et reporter dans BASE_DONNEES_PORT / REDIS_PORT / REDIS_CACHE_PORT).
#
# Les variables viennent du fichier .env à la racine du dépôt (voir .env.exemple).
name: boutique

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT_HOTE:-5432}:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Instance principale : compteurs de limitation du débit. Jamais d'éviction (un compteur évincé
  # remettrait une fenêtre à zéro) ; pleine, elle refuse les écritures et le limiteur laisse passer en
  # journalisant. 64 Mo couvrent plusieurs centaines de milliers de compteurs.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: ../.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_MOT_DE_PASSE\" --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT_HOTE:-6379}:6379"
    volumes:
      - donnees-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_MOT_DE_PASSE\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Instance du cache : éviction des clés les moins utilisées quand elle est pleine, sans persistance
  # (le cache se reconstruit depuis la base). Séparée de l'instance principale car maxmemory et la
  # politique d'éviction valent pour toute une instance, toutes bases confondues.
  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: ../.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_CACHE_MOT_DE_PASSE:-$$REDIS_MOT_DE_PASSE}\" --maxmemory 256mb --maxmemory-policy allkeys-lru --save '' --appendonly no"]
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT_HOTE:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_CACHE_MOT_DE_PASSE:-$$REDIS_MOT_DE_PASSE}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aucun « ports: » : le backend n'est joignable que depuis le réseau Docker (nginx, frontend SSR).
  # L'exposer publiquement permettrait de contourner nginx et de falsifier X-Forwarded-For (ADR 0003 §13).
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BASE_DONNEES_HOTE: postgres
      REDIS_HOTE: redis
      REDIS_CACHE_HOTE: redis-cache
      REDIS_CACHE_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Le backend démarre et répond même sans cache : simple ordre de démarrage
      redis-cache:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  # Pas d'env_file : le serveur SSR ne reçoit QUE les variables ci-dessous, jamais les secrets du .env
  # (clé JWT, Cloudinary, mots de passe). Une faille dans une dépendance Node qui lirait process.env ne
  # doit rien révéler d'utile. Contrôlé dans la CI par infra/scripts/verifier_env_frontend.py.
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      PORT: 4000
      API_URL_SERVEUR: http://backend:8080
      # Noms d'hôte acceptés par le SSR (protection SSRF). En production, définir NG_ALLOWED_HOSTS dans le
      # shell (ou lancer avec « --env-file ../.env », qui ne sert qu'à l'interpolation et n'injecte rien).
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost}
      # nginx est le seul point d'entrée et réécrit ces en-têtes : on peut s'y fier.
      # Sans cette liste, Angular ignore X-Forwarded-For et repasse en rendu côté navigateur.
      NG_TRUST_PROXY_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT_HOTE:-80}:80"
    volumes:
      # Modèle : les ${NGINX_…} sont remplacés au démarrage (voir l'en-tête du fichier)
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Limitation du débit par IP (CGNAT : valeurs généreuses). Débit en r/s ou r/m, rafale en requêtes.
      NGINX_DEBIT_API: ${NGINX_DEBIT_API:-20r/s}
      NGINX_RAFALE_API: ${NGINX_RAFALE_API:-100}
      NGINX_DEBIT_RECHERCHE: ${NGINX_DEBIT_RECHERCHE:-5r/s}
      NGINX_RAFALE_RECHERCHE: ${NGINX_RAFALE_RECHERCHE:-40}
      NGINX_DEBIT_PAGES: ${NGINX_DEBIT_PAGES:-5r/s}
      NGINX_RAFALE_PAGES: ${NGINX_RAFALE_PAGES:-40}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  donnees-postgres:
  donnees-redis:
