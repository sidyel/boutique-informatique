# Surcharge réservée à la CI (workflow Lighthouse), à ajouter APRÈS docker-compose.yml et docker-compose.dev.yml.
# Jamais en production ni en développement.
#
# La limitation du débit est coupée : la mesure connectée ouvre une session par passage (7 connexions par page,
# depuis la même IP et avec le même compte de test), ce qui déclencherait la limite « 10 connexions par heure pour
# un couple e-mail + IP » et fausserait la mesure. Le compte de test est dédié et utilisé avec son bon mot de passe :
# aucun échec de connexion, donc aucun verrouillage. La limitation reste vérifiée par les tests d'intégration du backend.
services:
  backend:
    environment:
      BOUTIQUE_LIMITATION_ACTIF: "false"
