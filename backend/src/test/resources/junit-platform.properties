# Extensions declarees dans META-INF/services (restauration de parametres_site apres chaque test)
junit.jupiter.extensions.autodetection.enabled=true
# Ordre aleatoire et rejouable (graine affichee au demarrage) : aucun test ne doit dependre de l ordre
junit.jupiter.testmethod.order.default=sn.boutique.support.OrdreAleatoire
junit.jupiter.testclass.order.default=sn.boutique.support.OrdreAleatoire
