<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{emails/mise-en-page :: page(~{::contenu})}">
<body>
<div th:fragment="contenu">
    <p th:if="${!#strings.isEmpty(prenom)}">Bonjour <span th:text="${prenom}">Awa</span>,</p>
    <p th:if="${#strings.isEmpty(prenom)}">Bonjour,</p>
    <p>Voici le nouveau lien de suivi de votre commande <strong th:text="${numero}">CMD-2026-000001</strong>.
       <strong>L'ancien lien ne fonctionne plus.</strong></p>
    <th:block th:replace="~{emails/bouton :: bouton(${lienSuivi}, 'Suivre ma commande')}"></th:block>
    <p>Ce lien est personnel : ne le partagez pas.</p>
</div>
</body>
</html>
