<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="page(contenu)">
<!--/*
  Mise en page commune des e-mails. Styles en ligne et tableaux : seule approche fiable dans Gmail,
  Outlook et les applications mobiles. Les couleurs reprennent les jetons du site
  (--couleur-texte #1C2128, --couleur-accent #C2410C) : les variables CSS ne fonctionnent pas dans un e-mail.
  Commentaire Thymeleaf : retiré au rendu, il n'apparaît pas dans l'e-mail envoyé.
*/-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title th:text="${sujet}">Sujet</title>
</head>
<body style="margin:0;padding:0;background:#F6F7F8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F7F8;padding:24px 0;">
  <tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#FFFFFF;border:1px solid #E4E7EB;border-radius:4px;">
      <tr><td style="padding:20px 28px;border-bottom:3px solid #C2410C;font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold;color:#1C2128;" th:text="${nomSite}">Boutique</td></tr>
      <tr><td style="padding:28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.55;color:#1C2128;">
        <div th:replace="${contenu}">Contenu</div>
      </td></tr>
      <tr><td style="padding:16px 28px;border-top:1px solid #E4E7EB;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#5B6573;">
        E-mail automatique envoyé par <span th:text="${nomSite}">Boutique</span>, merci de ne pas y répondre.<br>
        <a th:href="${urlSite}" th:text="${urlSite}" style="color:#5B6573;">site</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
