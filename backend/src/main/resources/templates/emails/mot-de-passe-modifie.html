<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{emails/mise-en-page :: page(~{::contenu})}">
<body>
<div th:fragment="contenu">
    <p>Bonjour <span th:text="${prenom}">Awa</span>,</p>
    <p>Le mot de passe de votre compte vient d'être modifié. Par sécurité, vous avez été déconnecté de tous
       vos appareils.</p>
    <p><strong>Ce n'était pas vous ?</strong> Choisissez immédiatement un nouveau mot de passe et contactez-nous.</p>
    <th:block th:replace="~{emails/bouton :: bouton(${lienMotDePasseOublie}, 'Sécuriser mon compte')}"></th:block>
</div>
</body>
</html>
