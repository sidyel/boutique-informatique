# Profil de développement local : valeurs par défaut alignées sur .env.exemple et infra/docker-compose.yml.
POSTGRES_DB: boutique
POSTGRES_USER: boutique
POSTGRES_PASSWORD: boutique-dev
REDIS_MOT_DE_PASSE: boutique-dev

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    sn.boutique: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

boutique:
  authentification:
    secret-ephemere-autorise: true
    # HTTP en local (test depuis un téléphone du réseau local, curl) : cookie sans l'attribut Secure
    cookie:
      secure: false

management:
  endpoint:
    health:
      show-details: always
