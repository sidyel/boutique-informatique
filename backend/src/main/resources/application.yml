# Configuration commune à tous les profils.
# Les valeurs sensibles viennent des variables d'environnement (voir .env.exemple à la racine).
spring:
  application:
    name: boutique-backend
  profiles:
    default: dev
  config:
    # En développement, lit le fichier .env de la racine du dépôt (ignoré par Git).
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${BASE_DONNEES_URL}
    username: ${BASE_DONNEES_UTILISATEUR}
    password: ${BASE_DONNEES_MOT_DE_PASSE}
    hikari:
      maximum-pool-size: ${BASE_DONNEES_POOL_MAX:10}

  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOTE:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_MOT_DE_PASSE:}

  cache:
    type: redis

  jackson:
    time-zone: Africa/Dakar

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  mail:
    host: ${SMTP_HOTE:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_UTILISATEUR:}
    password: ${SMTP_MOT_DE_PASSE:}

server:
  port: ${PORT_BACKEND:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    # Un serveur SMTP indisponible ne doit pas rendre l'API « hors service » :
    # les e-mails seront envoyés de façon asynchrone avec nouvelles tentatives.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

boutique:
  url-site: ${URL_SITE:http://localhost:4200}
  cors-origines: ${CORS_ORIGINES:http://localhost:4200}
