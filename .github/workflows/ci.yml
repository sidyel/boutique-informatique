name: CI

on:
  push:
    branches: [main]
  pull_request:

# Sur main, aucun run n'est annulé : avec le filtre par chemins, un push suivant qui ne touche pas le
# backend sauterait ses tests, et une modification annulée ne serait jamais vérifiée. Seules les pull
# requests annulent le run précédent (le run suivant reteste toute la branche).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Détecte les parties du dépôt modifiées pour ne lancer que les jobs utiles.
  changements:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtre.outputs.backend }}
      frontend: ${{ steps.filtre.outputs.frontend }}
      infra: ${{ steps.filtre.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filtre
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.env.exemple'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (compilation et tests)
    needs: changements
    if: needs.changements.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Les tests tournent dans un ordre aléatoire : trois graines différentes révèlent les dépendances à l'ordre.
    # Pour rejouer un échec : -Dsurefire.runOrder.random.seed=N -Djunit.jupiter.execution.order.random.seed=N
    strategy:
      fail-fast: false
      matrix:
        graine: [20261127, 7919, 314159265]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Docker est disponible sur ubuntu-latest : Testcontainers démarre PostgreSQL et Redis.
      - name: Compilation et tests (graine ${{ matrix.graine }})
        run: >-
          ./mvnw -B verify
          -Dsurefire.runOrder.random.seed=${{ matrix.graine }}
          -Djunit.jupiter.execution.order.random.seed=${{ matrix.graine }}

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests-backend-${{ matrix.graine }}
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (tests et build SSR)
    needs: changements
    if: needs.changements.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test -- --watch=false

      - name: Build de production (navigateur + SSR)
        run: npm run build

  infra:
    name: Infra (contrôles de sécurité de docker-compose)
    needs: changements
    if: needs.changements.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # docker compose exige le fichier .env : valeurs factices de l'exemple
      - name: Fichier .env factice
        run: cp .env.exemple .env

      - name: Le frontend SSR ne reçoit aucun secret
        run: python3 infra/scripts/verifier_env_frontend.py

      # Les deux modes (ADR 0006) : https, base de la production (certificat jetable pour le test), et http,
      # développement local. Mêmes montages que infra/docker-compose.yml.
      - name: Configuration nginx valide (modes https et http)
        run: |
          mkdir -p "$RUNNER_TEMP/certificats"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout "$RUNNER_TEMP/certificats/privkey.pem" -out "$RUNNER_TEMP/certificats/fullchain.pem"
          chmod 644 "$RUNNER_TEMP/certificats/privkey.pem"
          for mode in https http; do
            echo "Mode $mode"
            docker run --rm \
              -v "$PWD/infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
              -v "$PWD/infra/nginx/commun/emplacements.conf.template:/etc/nginx/templates/commun/emplacements.conf.template:ro" \
              -v "$PWD/infra/nginx/modes/$mode.conf.template:/etc/nginx/templates/mode/serveurs.conf.template:ro" \
              -v "$RUNNER_TEMP/certificats:/etc/nginx/certificats:ro" \
              -e NGINX_CERTIFICAT=/etc/nginx/certificats/fullchain.pem -e NGINX_CLE_CERTIFICAT=/etc/nginx/certificats/privkey.pem \
              -e NGINX_DEBIT_API=20r/s -e NGINX_RAFALE_API=100 -e NGINX_DEBIT_RECHERCHE=5r/s -e NGINX_RAFALE_RECHERCHE=40 \
              -e NGINX_DEBIT_PAGES=5r/s -e NGINX_RAFALE_PAGES=40 nginx:1.29-alpine nginx -t
          done

      # Aucun jeton secret (suivi de commande, e-mails de compte) dans les journaux nginx, Referer compris
      - name: Les journaux nginx ne contiennent aucun jeton
        run: bash infra/scripts/verifier_journaux_nginx.sh
