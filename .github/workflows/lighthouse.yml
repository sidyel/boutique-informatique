name: Lighthouse

# Performance mesurée sur une machine propre : la stack Docker complète (nginx, SSR, backend, PostgreSQL,
# Redis) avec les données de démonstration, puis Lighthouse mobile 7 fois par page, médiane retenue
# (la CI varie d'environ 0,5 s d'un passage à l'autre).
# Le site est servi comme en production : nginx en mode HTTPS + HTTP/2 (infra/nginx/modes/https.conf.template),
# avec un certificat autosigné généré pendant le job, jamais commité (ADR 0006).
# Échec si LCP > 2,5 s, CLS > 0,1 ou poids du premier chargement > 1 Mo ; avertissement si performance < 90
# (seuils et calcul : infra/scripts/lighthouse_mediane.py).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIGHTHOUSE_VERSION: '13.6.0'
  PASSAGES: '7'

jobs:
  lighthouse:
    name: Lighthouse mobile (médiane de 7 passages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installation de Lighthouse
        run: npm install --global "lighthouse@${LIGHTHOUSE_VERSION}"

      # Valeurs factices de l'exemple ; le profil prod exige une vraie clé JWT : clé jetable propre à ce job
      - name: Fichier .env de CI
        run: |
          cp .env.exemple .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          grep -q '^JWT_SECRET=.\+' .env
          # Compte client de test, dédié à ce job : mot de passe jetable, jamais affiché (masqué dans les journaux)
          MOT_DE_PASSE_COMPTE="$(openssl rand -hex 16)Aa1"
          echo "::add-mask::${MOT_DE_PASSE_COMPTE}"
          echo "DEMO_CLIENT_MOT_DE_PASSE=${MOT_DE_PASSE_COMPTE}" >> .env
          echo "LIGHTHOUSE_COMPTE_MOT_DE_PASSE=${MOT_DE_PASSE_COMPTE}" >> "$GITHUB_ENV"

      # Seule différence avec la production : le certificat (Let's Encrypt en phase 9). Clé jetable.
      - name: Certificat autosigné pour nginx
        run: |
          mkdir -p infra/certificats
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout infra/certificats/privkey.pem -out infra/certificats/fullchain.pem
          chmod 644 infra/certificats/privkey.pem

      - name: Démarrage de la stack avec les données de démonstration
        working-directory: infra
        env:
          DEMO: '1'
          NGINX_MODE: https
          URL_SITE_DOCKER: https://localhost
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci-sans-limitation-debit.yml
          up -d --build --wait --wait-timeout 900

      - name: Attente du catalogue de démonstration
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/api/accueil | python3 -c 'import json,sys; sys.exit(0 if any(s["produits"] for s in json.load(sys.stdin)["sections"]) else 1)'; then
              echo "Catalogue prêt"; exit 0
            fi
            sleep 5
          done
          echo "::error::Le catalogue de démonstration n'est pas disponible"; exit 1

      # Pages connectées (5b) : compte de test dédié (DEMO_CLIENT_*), une session neuve par passage, limitation du débit
      # coupée par docker-compose.ci-sans-limitation-debit.yml (sinon 7 connexions par page dépasseraient la limite horaire e-mail + IP).
      # Pages ajoutées au fil des parties : fiche produit en 3c, panier et commande en 4b (mesurés avec un panier
      # de démonstration : le script crée un panier invité et le présente par l'en-tête Cookie).
      # --certificat-autosigne (Chrome --ignore-certificate-errors) : uniquement dans ce job.
      - name: Lighthouse mobile
        env:
          LIGHTHOUSE_CMD: lighthouse
        run: >-
          python3 infra/scripts/lighthouse_mediane.py
          --base https://localhost
          --certificat-autosigne
          --passages "${PASSAGES}"
          --sortie rapports-lighthouse
          --page accueil=/
          --page categorie=/categorie/pc-portables
          --page fiche=/produit/apple-macbook-air-13-m2
          --page connexion=/connexion
          --page inscription=/inscription
          --variante-demo apple-macbook-air-13-m2
          --page-panier panier=/panier
          --page-panier commande=/commande
          --compte-email client@exemple.sn
          --page-connectee compte=/compte
          --page-connectee commandes=/compte/commandes
          --page-connectee-panier commande-connecte=/commande

      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-lighthouse
          path: rapports-lighthouse/
          if-no-files-found: ignore
          retention-days: 30

      - name: Journaux de la stack
        if: failure()
        working-directory: infra
        env:
          NGINX_MODE: https
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci-sans-limitation-debit.yml logs --no-color --tail=200
